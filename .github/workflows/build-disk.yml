---

# Modified by Sizedalloy33 in 2026
# Originally sourced from Universal Blue (Apache-2.0)

name: Build disk images
run-name: Build disk images (${{ github.event_name }})

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - './disk_config/disk.toml'
      - './disk_config/iso-kde.toml'
      - './.github/workflows/build-disk.yml'

env:
  IMAGE_NAME: "pulsaros" # output of build.yml, keep in sync
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "latest"
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build disk images
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        disk-type: ["qcow2", "anaconda-iso"]
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          # Concatenate the types with a hyphen
          DISK_TYPE=$(echo "${{ matrix.disk-type }}" | tr ' ' '-')
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "DISK_TYPE=${DISK_TYPE}" >> ${GITHUB_ENV}
          echo "USER_UID=${USER_UID}" >> ${GITHUB_ENV}
          echo "USER_GID=${USER_GID}" >> ${GITHUB_ENV}

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build disk images
        id: build
        uses: osbuild/bootc-image-builder-action@30960621b85c9e76c653082f9ef4cab5a10210d5 # main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ${{ matrix.disk-type == 'anaconda-iso' && './disk_config/iso-kde.toml' || './disk_config/disk.toml' }}
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          types: ${{ matrix.disk-type }}
          additional-args: --use-librepo=True --rootfs btrfs

      - name: Checksum outputs
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          SOURCE_DIR: ${{ steps.build.outputs.output-directory }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          for f in *; do
            [[ -f "$f" ]] || continue
            [[ "$f" == *.sha256 ]] && continue
            sha256sum "$f" > "${f}.sha256"
          done

      - name: Upload to Cloudflare R2 (latest only)
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          SOURCE_DIR: ${{ steps.build.outputs.output-directory }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          DISK_TYPE: ${{ matrix.disk-type }}
        run: |
          set -euo pipefail
          sudo apt-get update -y && sudo apt-get install -y rclone jq

          # Normalize the extension for this disk type
          ext="iso"; [[ "$DISK_TYPE" == "qcow2" ]] && ext="qcow2"

          # Stage the output under a stable, human-friendly filename
          mkdir -p latest_stage
          for f in "$SOURCE_DIR"/*."$ext"; do
            [[ -f "$f" ]] || continue
            cp "$f" "latest_stage/pulsaros-amd64.${ext}"
          done

          # Regenerate the checksum against the renamed file
          sum="$(sha256sum "latest_stage/pulsaros-amd64.${ext}" | awk '{print $1}')"
          echo "${sum}  pulsaros-amd64.${ext}" > "latest_stage/pulsaros-amd64.${ext}.sha256"

          # Overwrite the stable "latest" object for this disk type
          rclone copy latest_stage "R2:${R2_BUCKET}/pulsaros/latest" --progress

          # Merge this disk type's metadata into the shared manifest
          rclone copyto "R2:${R2_BUCKET}/pulsaros/manifest.json" manifest.json || echo '{}' > manifest.json
          size="$(stat -c%s "latest_stage/pulsaros-amd64.${ext}")"
          date="$(date -u +%Y%m%d)"
          jq --arg type "$DISK_TYPE" --arg ext "$ext" \
             --arg size "$size" --arg sha "$sum" --arg date "$date" \
             '.[$type] = {filename: ("pulsaros-amd64." + $ext), size: ($size|tonumber), sha256: $sha, date: $date}' \
             manifest.json > manifest.new.json
          rclone copyto manifest.new.json "R2:${R2_BUCKET}/pulsaros/manifest.json"

      - name: Regenerate download page
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          sudo apt-get update -y && sudo apt-get install -y rclone
          rclone copyto "R2:${R2_BUCKET}/pulsaros/manifest.json" manifest.json

          python3 - "$BASE_URL" <<'PYEOF'
          import json, sys
          base = sys.argv[1].rstrip("/")
          m = json.load(open("manifest.json"))

          def human(n):
              for unit in ["B", "KB", "MB", "GB"]:
                  if n < 1024:
                      return f"{n:.1f}{unit}"
                  n /= 1024
              return f"{n:.1f}TB"

          rows = ""
          for typ, info in sorted(m.items()):
              label = "ISO (installer)" if typ == "anaconda-iso" else "QCOW2 (VM image)"
              url = f"{base}/pulsaros/latest/{info['filename']}"
              rows += f"""
              <tr>
                <td>{label}</td>
                <td><a href="{url}">{info['filename']}</a></td>
                <td>{human(info['size'])}</td>
                <td><code>{info['sha256'][:12]}\u2026</code></td>
                <td>{info['date']}</td>
              </tr>"""

          html = f"""<!doctype html><html><head><meta charset="utf-8">
          <title>PulsarOS Downloads</title>
          <style>body{{font-family:system-ui,sans-serif;max-width:800px;margin:40px auto;padding:0 16px}}
          table{{width:100%;border-collapse:collapse}} td,th{{padding:8px;border-bottom:1px solid #ddd;text-align:left}}
          a{{text-decoration:none}} code{{font-size:0.85em;color:#666}}</style></head>
          <body><h1>PulsarOS Downloads</h1>
          <p>Always the latest build. Verify with the sha256 file next to each image.</p>
          <table><tr><th>Type</th><th>File</th><th>Size</th><th>SHA256</th><th>Built</th></tr>
          {rows}</table></body></html>"""
          open("index.html", "w").write(html)
          PYEOF

          rclone copyto index.html "R2:${R2_BUCKET}/index.html"