name: Release disk images
on:
  workflow_run:
    workflows:
      - Build disk images
    types:
      - completed
  workflow_dispatch:
    inputs:
      run-id:
        description: "Build disk images workflow run ID (optional; defaults to latest successful run on main)"
        required: false
        type: string
      tag:
        description: "Release tag (optional; defaults to vYYYYMMDD)"
        required: false
        type: string
permissions:
  contents: write
  actions: read
jobs:
  release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event != 'pull_request'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Resolve source workflow run
        id: source-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            run_id="${{ github.event.workflow_run.id }}"
            sha="${{ github.event.workflow_run.head_sha }}"
          elif [[ -n "${{ inputs.run-id }}" ]]; then
            run_id="${{ inputs.run-id }}"
            sha="$(gh api "repos/${{ github.repository }}/actions/runs/${run_id}" --jq .head_sha)"
          else
            run_id="$(gh run list \
              --workflow build-disk.yml \
              --branch main \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')"
            sha="$(gh api "repos/${{ github.repository }}/actions/runs/${run_id}" --jq .head_sha)"
          fi

          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Generate release tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ -n "${INPUT_TAG}" ]]; then
            tag="${INPUT_TAG}"
          else
            date="$(date -u +%Y%m%d)"
            tag="v${date}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Build release notes body
        env:
          BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          {
            echo "## Downloads"
            echo
            echo "All downloads: ${BASE_URL%/}/"
            echo
            echo "| Type | Link |"
            echo "|---|---|"
            echo "| ISO | ${BASE_URL%/}/pulsaros/latest/pulsaros-amd64.iso |"
            echo "| QCOW2 | ${BASE_URL%/}/pulsaros/latest/pulsaros-amd64.qcow2 |"
          } > body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@7b4da11513bf3f43f9999e90eabced41ab8bb048 # v2.2.0
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: PulsarOS ${{ steps.version.outputs.tag }}
          target_commitish: ${{ steps.source-run.outputs.sha }}
          generate_release_notes: true
          append_body: true
          body_path: body.md