---
name: Release disk images
on:
  workflow_run:
    workflows:
      - Build disk images
    types:
      - completed
  workflow_dispatch:
    inputs:
      run-id:
        description: "Build disk images workflow run ID (optional; defaults to latest successful run on main)"
        required: false
        type: string
      tag:
        description: "Release tag (optional; defaults to vYYYYMMDD-amd64 or vYYYYMMDD-arm64)"
        required: false
        type: string
permissions:
  contents: write
  actions: read
jobs:
  release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event != 'pull_request'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Resolve source workflow run
        id: source-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            run_id="${{ github.event.workflow_run.id }}"
            sha="${{ github.event.workflow_run.head_sha }}"
          elif [[ -n "${{ inputs.run-id }}" ]]; then
            run_id="${{ inputs.run-id }}"
            sha="$(gh api "repos/${{ github.repository }}/actions/runs/${run_id}" --jq .head_sha)"
          else
            run_id="$(gh run list \
              --workflow build-disk.yml \
              --branch main \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')"
            sha="$(gh api "repos/${{ github.repository }}/actions/runs/${run_id}" --jq .head_sha)"
          fi

          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

          platform="$(gh api "repos/${{ github.repository }}/actions/runs/${run_id}/artifacts" \
            --paginate \
            --jq '[.artifacts[].name | capture("pulsaros-(?<platform>amd64|arm64)-").platform] | map(select(. != null)) | unique | .[0] // empty')"
          if [[ -z "${platform}" ]]; then
            display_title="$(gh api "repos/${{ github.repository }}/actions/runs/${run_id}" --jq -r '.display_title')"
            if [[ "${display_title}" =~ \((amd64|arm64)\) ]]; then
              platform="${BASH_REMATCH[1]}"
            fi
          fi
          if [[ -z "${platform}" ]]; then
            platform="unknown"
          fi
          echo "platform=${platform}" >> "$GITHUB_OUTPUT"
      - name: Download build artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.source-run.outputs.run_id }}
          merge-multiple: true
          path: release-assets
      - name: Generate release tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          PLATFORM: ${{ steps.source-run.outputs.platform }}
        run: |
          if [[ -n "${INPUT_TAG}" ]]; then
            tag="${INPUT_TAG}"
          else
            date="$(date -u +%Y%m%d)"
            tag="v${date}-${PLATFORM}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@7b4da11513bf3f43f9999e90eabced41ab8bb048 # v2.2.0
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: PulsarOS ${{ steps.version.outputs.tag }}
          target_commitish: ${{ steps.source-run.outputs.sha }}
          generate_release_notes: true
          files: release-assets/**
